<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Select the frame before first paint, without waiting for Phaser to load.
      document.documentElement.classList.toggle(
        "portfolio-embed",
        new URLSearchParams(window.location.search).get("embed") === "portfolio",
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Независимый концепт браузерной промоигры для BeautyBomb."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Cpath fill='%231e1d3e' d='M2 2h28v28H2z'/%3E%3Cpath fill='%23ffef5c' d='M5 5h22v22H5z'/%3E%3Cpath fill='%2300b7d6' d='M9 9h14v14H9z'/%3E%3Cpath fill='%23ff4fab' d='M13 13h6v6h-6z'/%3E%3C/svg%3E"
    />
    <title>BeautyBomb Delivery — concept</title>
  </head>
  <body>
    <main class="app-shell">
      <div class="game-frame">
        <div id="game-root" aria-label="Игровое окно BeautyBomb Delivery">
          <section
            id="game-loading"
            class="game-loading"
            aria-live="polite"
            aria-busy="true"
          >
            <p class="game-loading__copy">
              <span aria-hidden="true">Курьер забирает товар</span><span class="game-loading__dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>
              <span class="game-loading__sr-only">Курьер забирает товар…</span>
            </p>
            <div
              class="game-loading__progress game-loading__progress--indeterminate"
              role="progressbar"
              aria-label="Загрузка игры"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <span></span>
            </div>
            <p class="game-loading__error" hidden>Не удалось загрузить игру</p>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
